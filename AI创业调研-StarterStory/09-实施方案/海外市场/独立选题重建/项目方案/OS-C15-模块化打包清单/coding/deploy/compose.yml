name: os-c15
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      C15_DATA_DIR: /data
      C15_CORS_ORIGINS: ${C15_CORS_ORIGINS:-http://localhost:6135}
    volumes:
      - c15-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:6135:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  c15-data:
