name: os-b04
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      EPISODE_DATA_DIR: /data
      EPISODE_CORS_ORIGINS: ${EPISODE_CORS_ORIGINS:-http://localhost:6173}
    volumes:
      - b04-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:6173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  b04-data:
